[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "twin"
version = "0.0.1"
description = "Twin Neighbor Embedding method (TWIN)"
authors = [
  { name = "ADNX" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
]
requires-python = "~=3.11"
dependencies = [
    "distinctipy>=1.3.4",
    "fa2>=1.1.2",
    "leidenalg>=0.11.0",
    "loguru>=0.7.3",
    "matplotlib>=3.10.8",
    "networkx>=3.6.1",
    "numpy>=2.4.1",
    "pandas>=3.0.3",
    "pyarrow>=21.0.0",
    "pydot>=4.0.1",
    "python-dotenv>=1.2.1",
    "python-igraph>=1.0.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.0",
    "seaborn>=0.13.2",
    # 0.7 fixes silent mode closing fd 2 without restoring it, which broke stderr (and so
    # loguru) for the rest of the process. Do not downgrade; tests/test_sgtsne_stdio.py pins it.
    "sgtsnepi>=0.7",
    "Shapely>=2.1.2",
    "tqdm>=4.67.1",
    "typeguard>=4.4.4",
    "typer>=0.21.1",
]

[project.optional-dependencies]
# nbstripout-fast backs the `jupyter` clean filter in .gitattributes. Without it on PATH, git
# cannot run the filter and every notebook shows as permanently modified.
jupyter = ["jupyter>=1.1.1", "nbstripout-fast>=1.0.5"]
test = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:twin.*"]
# `slow` is opt-in: `-m slow` runs it, a bare `pytest` does not. Only the tabula figure carries
# it (~3 min against a ~2 min suite), and a suite that doubles in length is one people stop
# running. Registered here so an unknown-marker warning cannot mask a typo'd marker.
markers = ["slow: opt-in, minutes rather than seconds (run with -m slow)"]
addopts = "-m 'not slow'"

[tool.black]
line-length = 99
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
)/
'''

[tool.ruff.lint.isort]
known-first-party = ["twin"]
force-sort-within-sections = true
